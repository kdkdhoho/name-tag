plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}
group = 'com.nametag'
version = '0.0.1-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform { excludeTags 'smoke' }; finalizedBy jacocoTestReport }
tasks.register('smoke', Test) { useJUnitPlatform { includeTags 'smoke' }; testClassesDirs = sourceSets.test.output.classesDirs; classpath = sourceSets.test.runtimeClasspath }
tasks.named('jacocoTestCoverageVerification') { violationRules { rule { limit { minimum = 0.40 } } } }
tasks.named('check') { dependsOn jacocoTestCoverageVerification }
